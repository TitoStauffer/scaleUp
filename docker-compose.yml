# ATENÇÃO: as credenciais abaixo (scaleup/scaleup) são default de desenvolvimento local.
# Antes de qualquer ambiente que não seja o laptop de dev, defina DB_USERNAME/DB_PASSWORD
# via variável de ambiente real (nunca use o fallback em produção ou em ambiente compartilhado).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-scaleup}
      POSTGRES_USER: ${DB_USERNAME:-scaleup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scaleup}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-scaleup} -d ${DB_NAME:-scaleup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-scaleup}
      DB_USERNAME: ${DB_USERNAME:-scaleup}
      DB_PASSWORD: ${DB_PASSWORD:-scaleup}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
