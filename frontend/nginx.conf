# Serve o build estático do frontend e faz proxy reverso de /api para o backend, no mesmo
# container/origem. Isso evita que o browser precise fazer uma chamada cross-origin direta
# para o serviço `backend` (o que exigiria CORS configurado no Spring Boot, que hoje não
# existe e está fora do escopo desta tarefa — só frontend). `backend` é o nome do serviço no
# docker-compose.yml, resolvido via DNS interno do Docker Compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA com React Router (BrowserRouter): qualquer rota que não seja um arquivo estático
    # cai no index.html, deixando o roteamento client-side assumir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
