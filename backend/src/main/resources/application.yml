spring:
  application:
    name: scaleup
  # ATENÇÃO: os defaults abaixo (scaleup/scaleup) são só para desenvolvimento local.
  # IMPORTANTE: definir DB_USERNAME/DB_PASSWORD via variável de ambiente real antes de
  # qualquer ambiente que não seja o laptop de dev — nunca depender deste fallback.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scaleup}
    username: ${DB_USERNAME:scaleup}
    password: ${DB_PASSWORD:scaleup}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

content:
  # Enquanto não houver processo de revisão humana do conteúdo (rascunhado por IA),
  # a API de leitura também serve itens com status_revisao = 'rascunho', além de
  # 'revisado_aprovado'. Decisão do Tito para a fase atual de desenvolvimento.
  # IMPORTANTE: desligar (definir como false) antes de expor a API a usuários reais
  # em produção, quando houver conteúdo de fato revisado.
  incluir-rascunho: ${CONTENT_INCLUIR_RASCUNHO:true}

auth:
  jwt:
    # ATENÇÃO: o valor abaixo é só para desenvolvimento local (mesmo padrão de aviso de
    # DB_USERNAME/DB_PASSWORD acima). IMPORTANTE: definir AUTH_JWT_SECRET via variável de
    # ambiente real (>= 32 bytes / 256 bits para HS256) antes de qualquer ambiente que não
    # seja o laptop de dev.
    secret: ${AUTH_JWT_SECRET:dev-only-secret-nao-use-em-producao-troque-via-AUTH_JWT_SECRET-32b}
    # 24h (ticket, seção 7: "expiração razoável"): sem refresh token neste ticket (fora de
    # escopo), equilíbrio entre não forçar login excessivo e limitar a janela de um token vazado.
    expiration-minutes: ${AUTH_JWT_EXPIRATION_MINUTES:1440}
  rate-limit:
    # Rate limiting simplificado (ticket, seção 8) — ver limitações documentadas em
    # identity.application.RateLimiter (em memória, não distribuído).
    max-tentativas: ${AUTH_RATE_LIMIT_MAX_TENTATIVAS:10}
    janela-minutos: ${AUTH_RATE_LIMIT_JANELA_MINUTOS:1}

email:
  # Mock por padrão; "smtp" usa spring.mail.* acima (credencial via variável de ambiente,
  # nunca hardcoded — ver docker-compose.yml e .env local, que não é versionado).
  provider: ${EMAIL_PROVIDER:mock}
  remetente: ${SMTP_FROM:no-reply@scaleup.dev}
